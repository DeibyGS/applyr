[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "applyr"
version = "1.1.0"
description = "CLI job application tracker designed for AI coding agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "colorama>=0.4.6",
]
authors = [
    { name = "Deiby Gorrin", email = "deibygorrin@gmail.com" },
]
keywords = [
    "job",
    "tracker",
    "cli",
    "ai",
    "career",
    "applications",
    "job-search",
    "job-tracker",
    "developer-tools",
    "terminal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]

[project.scripts]
applyr = "applyr.cli:main"

[project.urls]
Homepage = "https://github.com/DeibyGS/applyr"
Repository = "https://github.com/DeibyGS/applyr"
Issues = "https://github.com/DeibyGS/applyr/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: pure function tests"]

[tool.coverage.run]
source = ["applyr"]
omit = ["applyr/templates/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# No fail_under yet: the baseline is being measured first. Raise it once the
# untested modules found in the v0.8.0 audit (cv.py, commands/core.py, cli.py)
# have coverage, so the gate reflects a floor we already clear.

[tool.setuptools.packages.find]
include = ["applyr*"]

[tool.setuptools.package-data]
applyr = ["templates/*"]
