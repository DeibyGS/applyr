[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "applyr"
version = "1.11.1"
description = "CLI job application tracker designed for AI coding agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "colorama>=0.4.6",
]
authors = [
    { name = "Deiby Gorrin", email = "deibygorrin@gmail.com" },
]
keywords = [
    "job",
    "tracker",
    "cli",
    "ai",
    "career",
    "applications",
    "job-search",
    "job-tracker",
    "developer-tools",
    "terminal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]

[project.scripts]
applyr = "applyr.cli:main"

[project.urls]
Homepage = "https://github.com/DeibyGS/applyr"
Repository = "https://github.com/DeibyGS/applyr"
Issues = "https://github.com/DeibyGS/applyr/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
# Visual UI dashboard (docs/visual-ui/AGENTS.md, ADR-011) — opt-in only. The
# base `applyr` install stays dependency-light per ADR-005; this extra is the
# one exception, and it's never required to use the CLI.
ui = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: pure function tests"]

[tool.coverage.run]
source = ["applyr"]
omit = ["applyr/templates/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# The v0.8.0-audit modules (cv.py, commands/core.py, cli.py) now have real
# coverage, so this gate finally reflects a floor the suite already clears
# (measured 76% on 2026-08-15) rather than an aspirational number picked in
# advance. 1-point buffer below the measured value, not the value itself —
# rounding/platform noise shouldn't fail CI on a commit that changed nothing
# coverage-relevant. Raise deliberately as coverage grows; never lower it to
# make a red build green.
fail_under = 75

[tool.setuptools.packages.find]
include = ["applyr*"]

[tool.setuptools.package-data]
applyr = ["templates/*"]
